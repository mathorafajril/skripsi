
services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: aes-db
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"      
    volumes:
      - aes_pgdata:/var/lib/postgresql/data         
      - ./backend/db/migration.sql:/docker-entrypoint-initdb.d/migration.sql  
    networks:
      - aes-network

  # ── ML Service (Python FastAPI) ───────────────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: aes-ml
    restart: always
    environment:
      - LSTM_MODEL_PATH=/app/data/final_lstm_model_with_test.h5
      - FASTTEXT_MODEL_PATH=/app/data/cc.id.300.bin
    volumes:
      - ./ml/data:/app/data
    ports:
      - "8001:8001"
    networks:
      - aes-network

  # ── Backend (Express) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aes-backend
    restart: always
    environment:
      PORT:        ${PORT}
      DB_HOST:     db           # refers to the db service above, not localhost
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL:      false
      JWT_SECRET:  ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      ML_SERVICE_URL: http://ml:8001   # refers to the ml service above
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db                      # wait for db to start before backend
    networks:
      - aes-network

  # ── Frontend (React) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    container_name: aes-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aes-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  aes_pgdata:                 # named volume — data persists even if container is removed

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  aes-network:
    driver: bridge